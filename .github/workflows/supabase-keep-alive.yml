name: Supabase Keep-Alive Cron

on:
  schedule:
    # Runs every 3 days at 00:00 UTC (prevents the 7-day inactivity pause)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  keep-alive:
    name: Keep Supabase Active
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Supabase Keep-Alive Ping
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://rykclazrboauohqztvry.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5a2NsYXpyYm9hdW9ocXp0dnJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NjExNTAsImV4cCI6MjA4ODUzNzE1MH0.8FKT0u4kZLKMSukBgnYFn7GmEdZGwHuORgi5u4SXDY0' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5a2NsYXpyYm9hdW9ocXp0dnJ5Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3Mjk2MTE1MCwiZXhwIjoyMDg4NTM3MTUwfQ.sQf7r7vTaoLxndulTV7ZJSGIqlVjO-5r-O2KHcP3UkE' }}
          CMS_APP_URL: ${{ secrets.CMS_APP_URL }}
        run: |
          node scripts/keep-alive.mjs
          if [ -n "$CMS_APP_URL" ]; then
            echo "Pinging CMS keep-alive route..."
            curl -fsS "$CMS_APP_URL/api/cron/keep-alive" || true
          fi
